<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SP Talkies — Admin</title><link rel="stylesheet" href="/admin.css"></head><body><main>
<section id="login" class="login panel"><div class="mini-logo">SP TALKIES</div><h1>Studio Admin</h1><p>Manage films and productions.</p><form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><small id="loginMsg"></small></form></section>
<section id="dash" hidden><header><div><div class="mini-logo">SP TALKIES</div><h1>Studio dashboard</h1></div><div><a href="/" class="view">View site ↗</a><button id="logout" class="dark">Logout</button></div></header>
<div class="stats"><div><small>TOTAL TITLES</small><strong id="count">0</strong></div><div><small>FEATURED</small><strong id="featuredCount">0</strong></div><div><small>LAST UPDATED</small><strong>NOW</strong></div></div>
<section class="panel"><div class="panel-head"><div><small>CONTENT</small><h2 id="formTitle">Add a production</h2></div></div><form id="movieForm" enctype="multipart/form-data"><input type="hidden" id="id"><div class="two"><label>Title<input id="title" required></label><label>Year<input id="year" type="number"></label></div><div class="two"><label>Genre<input id="genre" placeholder="Drama, Romance..."></label><label>Category<select id="category"><option>Films</option><option>Series</option><option>Music</option><option>Productions</option></select></label></div><label>Description<textarea id="description"></textarea></label><label>Trailer URL<input id="trailer" placeholder="https://..."></label><label>Poster image<input id="poster" type="file" accept="image/*"></label><label class="check"><input id="featured" type="checkbox"> Show as featured</label><div><button>Save production</button><button type="button" id="cancel" class="secondary">Cancel</button></div></form></section>
<section><div class="list-head"><h2>All productions</h2><span id="status"></span></div><div id="list"></div></section></section></main><script src="/admin.js"></script></body></html>
